#
# Docker Compose file for the Low Domain Emulators Example
#

name: "ctxd-app"

include:
  - ./config.yml
  - ./emulators_config.yml
  
services:

  #
  # Low Domain Device Emulator Service
  #
  low_emulators:
    image:  ghcr.io/configuredthings/ctxd_low_emulators:${ctxd_version}
    hostname: emulators.low.ctxd
    networks:
      - ctxd_low
    configs:
      - source: status_low
        target: /opt/ct/system/config/status.sfjs  
      - source: config_low
        target: /opt/ct/config/config.sfjs  
      - source: mqtt_low
        target: /opt/ct/integrations/mqtt.sfjs  
    
networks:
  ctxd_low:
    name: ctxd_low



