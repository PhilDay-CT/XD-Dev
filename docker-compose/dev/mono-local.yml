name: "ctxd"

#
# Docker Compose file for a development version of 
# the Cross Domain services in "Mono" mode using
# local images
#
include:
  - ../high/config.yml
  - ../gateway/config.yml
  - ../low/config.yml
  - ../low/emulators_config.yml
  
#
# Secrets
#
secrets:
  git:
    file: ../../secrets/high/git    
  slack:
    file: ../../secrets/high/slack
  thingsboard:
    file: ../../secrets/high/thingsboard
        
#
# List of Dockers
#
services:

  high_mqtt:
    extends: 
      file: ./mono.yml
      service: high_mqtt
    image: ctxd_high_mqtt:${ctxd_version}
      
  high_import:
    extends:
      file: ./mono.yml
      service: high_import
    image: ctxd_high_import:${ctxd_version}
    secrets:
      - thingsboard
      
  high_export:
    extends:
      file: ./mono.yml
      service: high_export
    image: ctxd_high_export:${ctxd_version}
  


  import_diode:
    extends: 
      file: ./mono.yml
      service: import_diode
    image: ctxd_diode:${ctxd_version}
          
  export_diode:
    extends: 
      file: ./mono.yml
      service: export_diode
    image: ctxd_diode:${ctxd_version}

  low_mqtt:
    extends: 
      file: ./mono.yml
      service: low_mqtt
    image: ctxd_low_mqtt:${ctxd_version}
      
  low_import:
    extends:
      file: ./mono.yml
      service: low_import
    image: ctxd_low_import:${ctxd_version}

  low_export:
    extends:
      file: ./mono.yml
      service: low_export
    image: ctxd_low_export:${ctxd_version}

  low_emulators:
    extends:
      file: ./mono.yml
      service: low_emulators
    image: ctxd_low_emulators:${ctxd_version}

networks:
  ctxd_ops:
    name: ctxd_ops
  ctxd_low:
    name: ctxd_low
  ctxd_high:
    name: ctxd_high
    
